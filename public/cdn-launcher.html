<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Aureus launcher</title><style>*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{display:grid;place-items:center;background:#090909;color:#f7f7f8;font:16px system-ui,sans-serif}.launch{padding:15px 24px;border:1px solid #555;border-radius:12px;background:#19191d;color:#fff;font:inherit;cursor:pointer}.launch:hover{background:#29292f}p{position:fixed;bottom:18px;color:#aaa;font-size:13px;text-align:center}</style></head><body><button class="launch" id="launch">Open Aureus full screen</button><p>Opens Aureus in a new about:blank tab.</p><script>
document.querySelector("#launch").addEventListener("click",()=>{const win=window.open("about:blank","_blank");if(!win){alert("Allow pop-ups to open the page.");return}win.opener=null;win.document.open();win.document.write('<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loading Aureus…</title><style>*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#090909;color:#eee;font:15px system-ui,sans-serif}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#090909}#status{position:fixed;z-index:2;inset:0;display:grid;place-items:center;pointer-events:none}#status span{padding:12px 16px;border:1px solid #444;border-radius:10px;background:#18181de8}</style></head><body><iframe title="Aureus" allow="fullscreen; autoplay; encrypted-media; gamepad; pointer-lock" allowfullscreen></iframe><div id="status"><span>Loading Aureus…</span></div></body></html>');win.document.close();const frame=win.document.querySelector("iframe"),status=win.document.querySelector("#status");frame.src=location.origin+"/cdn-render";frame.addEventListener("load",()=>{try{if(frame.contentDocument?.contentType==="text/html")status.remove();else status.querySelector("span").textContent="Aureus could not load."}catch{status.remove()}},{once:true})});
</script></body></html>
